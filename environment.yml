name: pointcept-torch2.5.0-cu12.4
channels:
  - pyg
  - pytorch
  - nvidia/label/cuda-12.4.4
  - nvidia
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  - pip
  - cuda
  - conda-forge::cudnn
  - gcc=13.2
  - gxx=13.2
  - pytorch=2.5.0
  - torchvision=0.20.0
  - torchaudio=2.5.0
  - pytorch-cuda=12.4
  - ninja
  - google-sparsehash
  - h5py
  - pyyaml
  - tensorboard
  - tensorboardx
  - wandb
  - yapf
  - addict
  - einops
  - scipy
  - plyfile
  - termcolor
  - timm
  - ftfy
  - regex
  - tqdm
  - matplotlib
  - black
  - open3d
  - peft
  - pip:
    - torch-cluster -f https://data.pyg.org/whl/torch-2.5.0+cu124.html
    - torch-scatter -f https://data.pyg.org/whl/torch-2.5.0+cu124.html
    - spconv-cu124
    - brotli>=1.2  # huggingface_hub downloads fail with older brotli
    - git+https://github.com/Dao-AILab/flash-attention.git
    - ./libs/pointops